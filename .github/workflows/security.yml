name: Security gate

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit
      - name: Reject known high-severity dependency vulnerabilities
        run: npm run audit:security

  # Keep verification independent so a new advisory does not hide build/test results.
  # The final gate preserves the original required-check name.
  validation:
    name: Tests, builds and privacy scan
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # checkout fetch-depth=0 supplies branches/tags. Platform-owned PR refs
      # are audited separately in a mirror; they cannot be rewritten by a push.
      - name: Scan public files and reachable branch/tag history for privacy
        shell: bash
        run: |
          set -euo pipefail
          npm run public:check
          node scripts/public-history-audit.mjs

      - name: Typecheck, test, and both isolated runtime builds
        run: npm run verify && npm run build:ci && npm run bundle:check && npm run smoke:built

  verify:
    name: Verify and scan
    runs-on: ubuntu-latest
    needs: [dependencies, validation]
    if: ${{ always() }}
    steps:
      - name: Require dependency and verification jobs to pass
        env:
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: |
          test "$DEPENDENCIES_RESULT" = success
          test "$VALIDATION_RESULT" = success
